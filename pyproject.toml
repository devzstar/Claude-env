[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipper"
version = "0.1.0"
description = "Clipping pipeline for Content Rewards campaigns"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
clipper = "clipper.cli:main"

[tool.setuptools]
packages = ["clipper"]

[tool.setuptools.package-data]
clipper = ["schema.sql"]
